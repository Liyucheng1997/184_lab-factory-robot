<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工厂调度机器人仿真</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e2126; }
    #app { display: block; width: 100%; height: 100%; }

    #ui {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 232px;
      padding: 14px 16px;
      background: rgba(24, 27, 32, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #e8eaed;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
      z-index: 10;
    }
    #ui h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #ui h1::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #39d353;
      box-shadow: 0 0 8px #39d353;
    }
    .stats {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .stats > div {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 7px 4px;
      text-align: center;
    }
    .stats span {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: #7cc4ff;
    }
    .stats div:first-child span { color: #56d364; }
    .stats label {
      font-size: 11px;
      color: #9aa0a6;
    }
    #robot-list { margin-bottom: 10px; }
    .robot-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      padding: 3px 2px;
      color: #c9cdd2;
    }
    .robot-row .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .robot-row .rname { width: 26px; font-weight: 600; color: #e8eaed; }
    .robot-row .rstate { flex: 1; color: #9aa0a6; }
    .robot-row .rstate.busy { color: #7cc4ff; }
    .robot-row .rstate.wait { color: #ff7b72; }

    .controls button {
      width: 100%;
      margin-bottom: 6px;
      padding: 7px 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: #e8eaed;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .controls button:hover { background: rgba(255, 255, 255, 0.14); }
    .controls .row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #c9cdd2;
      margin: 8px 2px 0;
    }
    .controls input[type="range"] { flex: 1; accent-color: #7cc4ff; }
    .controls input[type="checkbox"] { accent-color: #7cc4ff; }
    #speed-val { width: 34px; text-align: right; color: #9aa0a6; }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #6e7278;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>工厂调度机器人</h1>
    <div class="stats">
      <div><span id="stat-done">0</span><label>已完成</label></div>
      <div><span id="stat-active">0</span><label>执行中</label></div>
      <div><span id="stat-queue">0</span><label>排队中</label></div>
    </div>
    <div id="robot-list"></div>
    <div class="controls">
      <button id="btn-pause">⏸ 暂停</button>
      <button id="btn-task">＋ 生成 3 个任务</button>
      <label class="row"><input type="checkbox" id="chk-paths" checked /> 显示路径规划</label>
      <label class="row">速度 <input type="range" id="rng-speed" min="0.5" max="3" step="0.1" value="1" /><span id="speed-val">1.0×</span></label>
    </div>
    <div class="hint">拖拽旋转 · 右键平移 · 滚轮缩放 · 空格暂停</div>
  </div>
  <canvas id="app"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
